# nginx reverse proxy for NAS Manager (Phase 14).
#
# Install as /etc/nginx/sites-available/nas-manager.conf, link it into
# sites-enabled, replace nas.example.org and the certificate paths, then
# `nginx -t && systemctl reload nginx`. The application listens on
# 127.0.0.1:8080 (NAS_HOST/NAS_PORT) and trusts X-Forwarded-* only from
# 127.0.0.1 (NAS_FORWARDED_ALLOW_IPS). Set NAS_TRUSTED_HOSTS to the
# server_name below and NAS_SESSION_COOKIE_SECURE=true.

# Drop-folder uploads per client address (the application also limits per
# uploader; this stops a flood before it reaches Python).
limit_req_zone $binary_remote_addr zone=nas_public_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nas_login:10m rate=30r/m;

upstream nas_manager {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nas.example.org;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 ships nginx 1.24; on 1.25.1+ prefer "listen 443 ssl;" plus
    # "http2 on;" (the listen parameter is deprecated there but still works).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nas.example.org;

    ssl_certificate     /etc/ssl/nas-manager/fullchain.pem;
    ssl_certificate_key /etc/ssl/nas-manager/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nas_tls:10m;
    ssl_session_tickets off;

    server_tokens off;

    # The largest request the application accepts is a file-manager upload
    # (NAS_MAX_UPLOAD_BYTES, 2 GiB by default) plus multipart framing.
    client_max_body_size 2100m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: a client-supplied X-Forwarded-For must not
    # reach the application, which keys throttles and quotas by address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://nas_manager;
    }

    # Stream uploads straight to the application (it enforces caps and
    # quotas while reading) instead of buffering them on the proxy's disk.
    location /api/v1/files/upload {
        proxy_request_buffering off;
        proxy_pass http://nas_manager;
    }
    location /api/v1/uploads {
        proxy_request_buffering off;
        proxy_pass http://nas_manager;
    }
    location /api/v1/media/upload {
        proxy_request_buffering off;
        proxy_pass http://nas_manager;
    }

    location = /api/v1/public/uploads {
        limit_req zone=nas_public_upload burst=10 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_pass http://nas_manager;
    }

    location = /api/v1/auth/login {
        limit_req zone=nas_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://nas_manager;
    }
    location = /login {
        limit_req zone=nas_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://nas_manager;
    }

    # Video playback uses HTTP Range; keep responses unbuffered.
    location /api/v1/media/ {
        proxy_buffering off;
        proxy_pass http://nas_manager;
    }
}
