[project]
name = "nas-manager"
version = "0.1.0"
description = "Ubuntu NAS management web application (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixed fake passwords (S107) and a fake ftplib (S321).
"tests/**" = ["S101", "S105", "S106", "S107", "S321"]
# FastAPI dependency injection conventionally uses Depends() in defaults.
"app/api/**" = ["B008"]
"app/web/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
