[alembic]
script_location = migrations
# Make the `app` package importable when the alembic console script runs from the project root.
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is intentionally unset: migrations/env.py reads NAS_DATABASE_URL
# (or the NAS_DATA_DIR default) through app.core.config.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
